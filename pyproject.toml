[project]
name = "rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium-robotics>=1.4.1",
    "gymnasium[atari,box2d,classic-control,mujoco]>=1.2.0",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pyqt5>=5.15.11",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "swig>=4.3.1",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[tool.setuptools.packages.find]
where = ["src"]
