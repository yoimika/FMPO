# Base Config
flow_cfg: &base_train_cfg
  epoches: 256
  batch_size: 256
  learning_rate: 1.0e-4
  optim_name: 'Adam'
  save_dir: './save/'
  env_name: "FetchPickAndPlace"


# Imitation Learning Config
il_flow_train: &il_train_cfg
  <<: *base_train_cfg
  teacher_dataset_fp: './save/sac-teacher.pkl'

il_flow_train2:
  <<: *il_train_cfg 
  optim_name: "AdamW"
  save_file_name: "flow-imitation2.pth"

il_flow_train3:
  <<: *il_train_cfg
  optim_name: "AdamW"
  save_file_name: "flow-imitation3.pth"
  # Attention: Large batch size may lead to overfit which cause poor generalization in test.
  batch_size: 256 

il_flow_train4:
  <<: *il_train_cfg
  optim_name: "AdamW"
  save_file_name: "flow-imitation4.pth"
  # Attention: Large batch size may lead to overfit which cause poor generalization in test.
  batch_size: 256 

# Reinforcement Learning Config


rl_flow_train: &rl_train_cfg
  <<: *base_train_cfg
  episode_length: 10000
  num_envs: 10
  batch_size: 2500
  epoches: 1000
  save_file_name: "flow-rl.pth"
  base_model_file_name: "flow-imitation3.pth"
  algorithm: "PPO"


# episode_length = k * 50 * num_envs
# episode_length = m * batch_size
# k, m should be integer
# Update time = episode_length / batch_size (i.e. m)
rl_flow_train_gpu: &rl_train_cfg_gpu
  <<: *rl_train_cfg
  episode_length: 12800
  num_envs: 32
  batch_size: 3200
  epoches: 1000
  save_file_name: "flow-rl-gpu.pth"
  save_interval: 10
  save_dir: "./save/flow_rl_gpu"

  save_idx: True
  load_idx: 0

rl_flow_train_sde: 
  <<: *rl_train_cfg
  episode_length: 51200
  num_envs: 256
  batch_size: 12800
  epoches: 1000
  save_file_name: "flow-rl-sde.pth"
  save_interval: 10
  save_dir: "./save/flow_rl_sde"

  save_idx: True
  load_idx: 0

rl_flow_train_tmp: 
  <<: *rl_train_cfg_gpu
  save_file_name: "flow-rl-tmp.pth"
  save_interval: 10
  save_dir: "./save/flow_rl_tmp"
  load_idx: 0